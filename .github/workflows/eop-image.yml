name: EoP-Milky image

on:
  push:
    branches: [main]
    paths:
      - "services/eop-milky/**"
      - ".github/workflows/eop-image.yml"

concurrency:
  group: eop-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: services/eop-milky
          push: true
          tags: ghcr.io/${{ github.repository }}/eop-milky:sha-${{ github.sha }}
